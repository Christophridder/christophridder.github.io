<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyngdebrønden – Fysik A</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #1e293b; }
#tb {
  background: #f1f5f9; border-radius: 14px; overflow: hidden;
  max-width: 1000px; margin: 0 auto; box-shadow: 0 4px 24px rgba(0,0,0,0.13);
}
.tb-head {
  background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 100%);
  padding: 12px 20px; color: white; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.tb-head h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
.tb-head p { font-size: 0.78rem; opacity: 0.8; flex: 1; min-width: 200px; }
.tb-head a { color: white; font-size: 0.75rem; opacity: 0.85; }
#c { display: block; width: 100%; height: auto; aspect-ratio: 1.3 / 1; min-height: 340px; background: #0b1220; touch-action: none; }
.panel { background: white; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.read { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
@media (max-width: 560px) { .read { grid-template-columns: repeat(2, 1fr); } }
.card { background: #f1f5f9; border-radius: 8px; padding: 5px 7px; min-width: 0; }
.card .k { font-size: 0.66rem; color: #64748b; font-weight: 700; white-space: nowrap; }
.card .v { font-size: 0.86rem; font-weight: 700; color: #0f172a; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card.pot .k { color: #1d4ed8; } .card.kin .k { color: #15803d; } .card.mek .k { color: #b45309; }
.grp label { display: flex; justify-content: space-between; font-size: 0.74rem; font-weight: 700; color: #475569; margin-bottom: 1px; }
.grp label span { color: #1e40af; }
input[type=range] { width: 100%; accent-color: #2563eb; }
.presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.presets button { flex: 1 1 auto; }
button {
  border: 1.5px solid #cbd5e1; background: white; border-radius: 7px; padding: 6px 8px;
  font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; color: #1e293b;
}
button:hover { border-color: #2563eb; color: #1e40af; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button { flex: 1 1 120px; padding: 7px; font-size: 0.82rem; }
button.go, button[aria-pressed="true"] { background: #2563eb; border-color: #2563eb; color: white; }
.check { font-size: 0.78rem; font-weight: 600; color: #334155; display: flex; gap: 6px; align-items: center; cursor: pointer; }
.note { font-size: 0.8rem; line-height: 1.4; color: #334155; min-height: 2.8em; }
.small { font-size: 0.72rem; line-height: 1.4; color: #64748b; padding: 0 12px 10px; background: white; }
</style>
</head>
<body>
<div id="tb">
  <div class="tb-head">
    <h1>Tyngdebrønden</h1>
    <p>Den potentielle energi for 1 kg omkring Jorden. Rummet øverst og kurven nederst har samme r-akse.</p>
    <a href="tyngdebroend.html" target="_blank" rel="noopener">Åbn i fuld skærm ↗</a>
  </div>
  <canvas id="c" aria-label="Jorden og et legeme øverst, og energidiagram med potentiel energi som funktion af afstanden nederst"></canvas>
  <div class="panel">
    <div class="read">
      <div class="card"><div class="k">Afstand r</div><div class="v" id="rR"></div></div>
      <div class="card"><div class="k">Fart v</div><div class="v" id="rV"></div></div>
      <div class="card pot"><div class="k">Epot</div><div class="v" id="rP"></div></div>
      <div class="card kin"><div class="k">Ekin</div><div class="v" id="rK"></div></div>
      <div class="card mek"><div class="k">Emek</div><div class="v" id="rE"></div></div>
    </div>
    <div class="grp" id="gV">
      <label for="sV">Startfart ved jordoverfladen <span id="vV"></span></label>
      <input type="range" id="sV" min="1" max="13" step="0.1" value="7.9">
      <div class="presets" id="pre"></div>
    </div>
    <div class="btns">
      <button id="bGo" class="go">▶ Affyr</button>
      <button id="bNul">↺ Forfra</button>
      <button id="bTræk" aria-pressed="false">Træk selv</button>
    </div>
    <label class="check"><input type="checkbox" id="cMgh"> Vis modellen m·g·h</label>
    <p class="note" id="tekst"></p>
  </div>
  <p class="small">Legemet skydes lodret op. Der er ingen luftmodstand, og Jordens rotation er ignoreret. Tiden er sat op, og mest langt ude.</p>
</div>

<script>
// Samme konstanter som på siden. Energierne er pr. kg i MJ.
const G = 6.67e-11, M = 5.97e24, R = 6.37e6, GM = G * M, g = GM / R / R;
const E0 = GM / R / 1e6;            // |Epot| ved overfladen i MJ/kg (62,5)
const RMAX = 12, EOP = 26, ENED = -72;
const $ = id => document.getElementById(id);
const dk = (x, n) => x.toFixed(n).replace('.', ',').replace('-', '−');
const ePot = r => -E0 / r;          // r i jordradier

let tilstand = 'klar';              // klar, flyver, lander, væk, træk
let r = 1, v = 0, retur = false;

const vStart = () => +$('sV').value * 1000;
const eMek = () => vStart() ** 2 / 2 / 1e6 - E0;

[['3,0', 3], ['7,9', 7.9], ['10', 10], ['11,2', 11.2], ['13', 13]].forEach(([t, x]) => {
  const b = document.createElement('button');
  b.textContent = t + ' km/s';
  b.onclick = () => { $('sV').value = x; nulstil(); };
  $('pre').appendChild(b);
});

function pil(c, x, y1, y2, farve, tekst, side) {
  const L = Math.abs(y2 - y1); if (L < 3) return;
  const sg = Math.sign(y2 - y1), hd = Math.min(9, L * .45);
  c.strokeStyle = c.fillStyle = farve; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y2 - sg * hd); c.stroke();
  c.beginPath(); c.moveTo(x, y2); c.lineTo(x - 5.5, y2 - sg * hd); c.lineTo(x + 5.5, y2 - sg * hd); c.closePath(); c.fill();
  if (tekst && L > 16) mærke(c, tekst, x + side * 9, (y1 + y2) / 2, farve, side < 0 ? 'right' : 'left');
}

function mærke(c, tekst, x, y, farve, align) {
  c.font = '700 12px system-ui, sans-serif'; c.textAlign = align || 'left'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = 3.5; c.strokeStyle = '#0b1220'; c.strokeText(tekst, x, y);
  c.fillStyle = farve; c.fillText(tekst, x, y);
}

function tegn() {
  const cv = $('c'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#0b1220'; c.fillRect(0, 0, w, h);

  const pl = 44, pr = 14, enh = (w - pl - pr) / RMAX;
  const X = q => pl + q * enh;
  const stribe = Math.min(enh * 2.3, h * .24), yBane = stribe / 2;
  const top = stribe + 8, bund = h - 26;
  const Y = e => top + (bund - top) * (EOP - e) / (EOP - ENED);

  // --- Rummet øverst ---
  c.save(); c.beginPath(); c.rect(0, 0, w, stribe); c.clip();
  c.fillStyle = '#2563eb'; c.beginPath(); c.arc(X(0), yBane, enh, 0, 7); c.fill();
  c.restore();
  mærke(c, 'Jorden', X(0) + 4, yBane, '#dbeafe');
  c.strokeStyle = '#334155'; c.lineWidth = 1; c.beginPath(); c.moveTo(X(1), yBane); c.lineTo(w - pr, yBane); c.stroke();
  for (const [navn, q] of [['ISS', 1.06], ['GPS', 4.17], ['Geo', 6.62]]) {
    c.strokeStyle = '#64748b'; c.beginPath(); c.moveTo(X(q), yBane - 6); c.lineTo(X(q), yBane + 6); c.stroke();
    c.fillStyle = '#94a3b8'; c.font = '600 10px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(navn, X(q) + (navn === 'ISS' ? 5 : 0), yBane - 8);
  }

  // --- Energidiagram ---
  // Hele brønden under nul-linjen
  c.beginPath(); c.moveTo(X(1), Y(0));
  for (let q = 1; q <= RMAX; q += .05) c.lineTo(X(q), Y(ePot(q)));
  c.lineTo(X(RMAX), Y(0)); c.closePath();
  c.fillStyle = 'rgba(37,99,235,.17)'; c.fill();

  c.fillStyle = 'rgba(148,163,184,.13)'; c.fillRect(pl, top, enh, bund - top);
  mærke(c, 'Inde i', X(.5), Y(10), '#94a3b8', 'center');
  mærke(c, 'Jorden', X(.5), Y(10) + 14, '#94a3b8', 'center');

  // akser
  c.strokeStyle = '#475569'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(pl, top); c.lineTo(pl, bund); c.lineTo(w - pr, bund); c.stroke();
  c.fillStyle = '#94a3b8'; c.font = '600 10px system-ui, sans-serif'; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const e of [20, 0, -20, -40, -60]) {
    c.fillText(dk(e, 0), pl - 5, Y(e));
    c.strokeStyle = 'rgba(100,116,139,.25)'; c.beginPath(); c.moveTo(pl, Y(e)); c.lineTo(w - pr, Y(e)); c.stroke();
  }
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (let q = 2; q <= RMAX; q += 2) c.fillText(q, X(q), bund + 4);
  c.fillText('r (jordradier)', X(RMAX / 2 + 1), bund + 13 > h - 12 ? h - 11 : bund + 13);
  c.save(); c.translate(11, (top + bund) / 2); c.rotate(-Math.PI / 2);
  c.fillText('Energi (MJ pr. kg)', 0, -5); c.restore();

  // nul-linjen
  c.strokeStyle = '#e2e8f0'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(pl, Y(0)); c.lineTo(w - pr, Y(0)); c.stroke();
  c.textAlign = 'right'; mærke(c, 'E = 0: uendeligt langt væk', w - pr - 2, Y(0) - 10, '#e2e8f0', 'right');

  // mgh-modellen
  if ($('cMgh').checked) {
    c.strokeStyle = '#f472b6'; c.lineWidth = 2; c.setLineDash([6, 4]);
    c.beginPath(); c.moveTo(X(1), Y(-E0)); c.lineTo(X(2.4), Y(-E0 + E0 * 1.4)); c.stroke(); c.setLineDash([]);
    mærke(c, 'm·g·h', X(2.3), Y(-E0 + E0 * 1.3), '#f472b6');
  }

  // kurven
  c.strokeStyle = '#60a5fa'; c.lineWidth = 3; c.lineJoin = 'round';
  c.beginPath();
  for (let q = 1; q <= RMAX; q += .03) { q === 1 ? c.moveTo(X(q), Y(ePot(q))) : c.lineTo(X(q), Y(ePot(q))); }
  c.stroke();
  mærke(c, 'Epot = −GMm/r', X(6), Y(ePot(6)) + 18, '#93c5fd');

  const synlig = Math.min(r, RMAX), xB = X(synlig), P = ePot(r);

  if (tilstand === 'træk') {
    c.strokeStyle = '#4ade80'; c.setLineDash([3, 4]); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(X(1), Y(-E0)); c.lineTo(xB, Y(-E0)); c.stroke(); c.setLineDash([]);
    pil(c, xB, Y(-E0), Y(P), '#4ade80', 'Arbejde A', 1);
  } else {
    const E = eMek();
    if (Y(E) > top) {
      // Energilinjen: legemet kan kun være, hvor linjen ligger over kurven
      const rVend = E < 0 ? E0 / -E : Infinity;
      c.strokeStyle = '#fbbf24'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(X(1), Y(E)); c.lineTo(X(Math.min(rVend, RMAX)), Y(E)); c.stroke();
      if (rVend < RMAX) {
        c.setLineDash([3, 5]); c.lineWidth = 1.2; c.beginPath(); c.moveTo(X(rVend), Y(E)); c.lineTo(X(RMAX), Y(E)); c.stroke(); c.setLineDash([]);
        c.fillStyle = '#fbbf24'; c.beginPath(); c.arc(X(rVend), Y(E), 4.5, 0, 7); c.fill();
      }
      mærke(c, 'Emek', X(1) + 8, Y(E) - 10, '#fbbf24');
    }
    if (r < RMAX) {
      pil(c, xB, Y(0), Y(P), 'rgba(96,165,250,.75)', 'Epot', 1);
      pil(c, xB, Y(P), Y(E), '#4ade80', 'Ekin', -1);
    }
  }

  // Forbindelse mellem rummet og kurven
  c.strokeStyle = 'rgba(226,232,240,.35)'; c.lineWidth = 1; c.setLineDash([2, 4]);
  c.beginPath(); c.moveTo(xB, yBane); c.lineTo(xB, Y(P)); c.stroke(); c.setLineDash([]);

  c.fillStyle = '#fff'; c.strokeStyle = '#0b1220'; c.lineWidth = 2;
  c.beginPath(); c.arc(xB, yBane, 6, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#60a5fa'; c.beginPath(); c.arc(xB, Y(P), 6.5, 0, 7); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();

  // Tal
  const E = tilstand === 'træk' ? P : eMek();
  const K = Math.max(E - P, 0);
  $('rR').textContent = dk(r, 2) + ' R';
  $('rV').textContent = dk(tilstand === 'træk' ? 0 : (tilstand === 'klar' ? vStart() : Math.abs(v)) / 1000, 1) + ' km/s';
  $('rP').textContent = dk(P, 1) + ' MJ';
  $('rK').textContent = dk(K, 1) + ' MJ';
  $('rE').textContent = dk(E, 1) + ' MJ';
  $('vV').textContent = dk(+$('sV').value, 1) + ' km/s';
  $('bGo').textContent = tilstand === 'flyver' ? '⏸ Pause' : '▶ Affyr';

  const E_ = eMek();
  let t;
  if (tilstand === 'træk') {
    const A = P + E0, Amgh = E0 * (r - 1);
    t = `Træk prikken i diagrammet. Arbejdet fra overfladen er ${dk(A, 1)} MJ pr. kg. `
      + ($('cMgh').checked ? `Modellen m·g·h giver ${dk(Amgh, 1)} MJ. ` : '')
      + `Helt ud til det uendelige koster ${dk(E0, 1)} MJ.`;
  } else if (tilstand === 'klar') {
    t = E_ < 0
      ? 'Den gule linje er legemets samlede energi. Legemet kan kun nå ud til, hvor linjen rammer kurven.'
      : 'Den gule linje ligger over nul-linjen, så den rammer aldrig kurven.';
  } else if (tilstand === 'væk') {
    t = E_ >= 0
      ? `Emek er ikke negativ, så legemet undslipper og kommer aldrig tilbage. Langt væk har det stadig ${dk(E_, 1)} MJ pr. kg bevægelsesenergi.`
      : `Legemet forlader billedet, men Emek er negativ. Det vender ved ${dk(E0 / -E_, 0)} jordradier og falder tilbage.`;
  } else if (tilstand === 'lander') {
    t = 'Legemet er tilbage på Jorden med samme fart, som det startede med. Energien er bevaret.';
  } else {
    t = v >= 0
      ? 'På vej op: Epot vokser, Ekin falder, og Emek er konstant.'
      : 'På vej ned: Epot bliver til Ekin igen.';
  }
  $('tekst').textContent = t;
}

function trin(dtSk) {
  // Tiden går hurtigere langt ude, så flyvningen bliver til at se på
  const tid = 170 * r ** 1.5 * dtSk;
  const n = Math.max(1, Math.ceil(tid / 5)), h = tid / n;
  for (let i = 0; i < n; i++) {
    const a1 = -GM / (r * R) ** 2;
    const rm = r * R + v * h + .5 * a1 * h * h;
    const a2 = -GM / rm ** 2;
    v += .5 * (a1 + a2) * h;
    r = rm / R;
    if (r <= 1) { r = 1; v = -vStart(); tilstand = 'lander'; return; }
    if (r >= RMAX) { r = RMAX; tilstand = 'væk'; return; }
  }
}

let sidst = null;
function loop(ts) {
  const dt = sidst === null ? 0 : Math.min((ts - sidst) / 1000, .05);
  sidst = ts;
  if (tilstand === 'flyver') { trin(dt); tegn(); }
  requestAnimationFrame(loop);
}

function nulstil() {
  tilstand = $('bTræk').getAttribute('aria-pressed') === 'true' ? 'træk' : 'klar';
  r = tilstand === 'træk' ? 3 : 1; v = 0;
  tegn();
}

$('bGo').onclick = () => {
  if ($('bTræk').getAttribute('aria-pressed') === 'true') $('bTræk').click();
  if (tilstand === 'klar') { r = 1; v = vStart(); tilstand = 'flyver'; }
  else if (tilstand === 'flyver') tilstand = 'pause';
  else if (tilstand === 'pause') tilstand = 'flyver';
  else { r = 1; v = vStart(); tilstand = 'flyver'; }
  tegn();
};
$('bNul').onclick = nulstil;
$('sV').oninput = nulstil;
$('cMgh').onchange = tegn;
$('bTræk').onclick = e => {
  const på = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', på);
  $('gV').style.opacity = på ? .45 : 1;
  nulstil();
};

function trækTil(ev) {
  if (tilstand !== 'træk') return;
  const b = $('c').getBoundingClientRect();
  const enh = (b.width - 58) / RMAX;
  r = Math.min(RMAX, Math.max(1, (ev.clientX - b.left - 44) / enh));
  tegn();
}
let trækker = false;
$('c').addEventListener('pointerdown', ev => { trækker = true; trækTil(ev); });
window.addEventListener('pointermove', ev => { if (trækker) trækTil(ev); });
window.addEventListener('pointerup', () => { trækker = false; });

nulstil();
new ResizeObserver(tegn).observe($('tb'));
requestAnimationFrame(loop);
</script>
</body>
</html>
