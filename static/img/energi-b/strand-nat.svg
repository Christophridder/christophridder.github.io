<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="900" height="310" fill="#1b2547"/><rect y="290" width="900" height="290" fill="#9c8a5c"/><path d="M430 290 C500 290 520 372 610 372 L900 372 L900 290 Z" fill="#23507e"/><text x="24" y="40" font-size="28" fill="white" text-anchor="start" font-weight="bold">Nat: solen er væk</text><circle cx="450" cy="62" r="30" fill="#e2e8f0"/><circle cx="462" cy="54" r="26" fill="#1b2547"/><circle cx="90" cy="90" r="2.5" fill="white"/><circle cx="210" cy="60" r="2.5" fill="white"/><circle cx="300" cy="120" r="2.5" fill="white"/><circle cx="610" cy="50" r="2.5" fill="white"/><circle cx="720" cy="110" r="2.5" fill="white"/><circle cx="840" cy="70" r="2.5" fill="white"/><circle cx="520" cy="140" r="2.5" fill="white"/><circle cx="160" cy="150" r="2.5" fill="white"/><line x1="230" y1="280" x2="230" y2="170" stroke="#fca5a5" stroke-width="5" marker-end="url(#p)"/><line x1="680" y1="290" x2="680" y2="180" stroke="#fca5a5" stroke-width="5" marker-end="url(#p)"/><text x="450" y="225" font-size="19" fill="white" text-anchor="middle" font-weight="normal">begge afgiver energi</text><text x="450" y="248" font-size="19" fill="white" text-anchor="middle" font-weight="normal">til natteluften</text><rect x="71" y="170" width="18" height="132" rx="9" fill="white" stroke="white" stroke-width="2"/><circle cx="80" cy="308" r="15" fill="#dc2626" stroke="white" stroke-width="2"/><rect x="76" y="260.0" width="8" height="42.0" fill="#dc2626"/><text x="102" y="192" font-size="26" fill="white" text-anchor="start" font-weight="bold">15 °C</text><rect x="791" y="170" width="18" height="132" rx="9" fill="white" stroke="white" stroke-width="2"/><circle cx="800" cy="308" r="15" fill="#dc2626" stroke="white" stroke-width="2"/><rect x="796" y="252.8" width="8" height="49.2" fill="#dc2626"/><text x="822" y="192" font-size="26" fill="white" text-anchor="start" font-weight="bold">18 °C</text><text x="250" y="345" font-size="24" fill="#1e293b" text-anchor="middle" font-weight="bold">Sand</text><text x="740" y="345" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Vand</text><rect y="400" width="900" height="180" fill="white"/><text x="24" y="432" font-size="20" fill="#1e293b" text-anchor="start" font-weight="bold">Energi til at varme 1 kg op med 1 K (én blok = 800 J):</text><text x="24" y="472" font-size="20" fill="#1e293b" text-anchor="start" font-weight="normal">Sand: c ≈ 800 J/(kg·K)</text><rect x="300" y="456" width="44.0" height="22" fill="#d97706" stroke="white"/><text x="24" y="510" font-size="20" fill="#1e293b" text-anchor="start" font-weight="normal">Vand: c = 4182 J/(kg·K)</text><rect x="300" y="494" width="44.0" height="22" fill="#2563eb" stroke="white"/><rect x="347" y="494" width="44.0" height="22" fill="#2563eb" stroke="white"/><rect x="394" y="494" width="44.0" height="22" fill="#2563eb" stroke="white"/><rect x="441" y="494" width="44.0" height="22" fill="#2563eb" stroke="white"/><rect x="488" y="494" width="44.0" height="22" fill="#2563eb" stroke="white"/><rect x="535" y="494" width="10.0" height="22" fill="#2563eb" stroke="white"/><text x="24" y="556" font-size="19" fill="#dc2626" text-anchor="start" font-weight="bold">Når sandet mister 1 grad, skal vandet afgive ca. 5 gange så meget energi for det samme.</text>
