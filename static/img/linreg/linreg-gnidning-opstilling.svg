  <!-- kræfter -->
  <line x1="150" y1="163" x2="90" y2="163" stroke="#dc2626" stroke-width="3" marker-end="url(#arr)"/>
  <text x="62" y="152" font-size="15" font-style="italic" fill="#dc2626">F</text><text x="72" y="156" font-size="11" font-style="italic" fill="#dc2626">gnid</text>
    <line x1="259" y1="120" x2="259" y2="45" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
  <text x="268" y="58" font-size="15" font-style="italic" fill="#2563eb">F</text><text x="278" y="62" font-size="11" font-style="italic" fill="#2563eb">N</text>
  <text x="268" y="80" font-size="11" fill="#64748b">normalkraft (= tyngden af klods + lodder)</text>
