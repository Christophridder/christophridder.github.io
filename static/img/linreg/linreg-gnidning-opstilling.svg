  <line x1="270" y1="140" x2="360" y2="140" stroke="#334155" stroke-width="1.5"/>
  <rect x="360" y="131" width="110" height="18" rx="9" fill="#fde68a" stroke="#b45309"/>
  <g stroke="#b45309" stroke-width="1">
    <line x1="380" y1="133" x2="380" y2="140"/><line x1="395" y1="133" x2="395" y2="140"/><line x1="410" y1="133" x2="410" y2="140"/><line x1="425" y1="133" x2="425" y2="140"/><line x1="440" y1="133" x2="440" y2="140"/>
  </g>
