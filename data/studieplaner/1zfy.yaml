# Skabelon for et nyt modul (kopiér, ret, gem):
#      - dato: 2026-11-17
#        modul: 2                      # modulnummer på dagen
#        tekst: Vi lavede [[slug]] og regnede opgaver i [[slug|egen linktekst]]
#        lektier: Læs [[slug]]
#        eksp: [slug]                  # eller udvidet: - side: slug / timer: 4 / aflevering: J / eksamen: ja
# Alle andre felter (emne, materialer, maal) er valgfrie.
# Modul 2-9: datoerne er gættede. Ret dem efter skemaet.

