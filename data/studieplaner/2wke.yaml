# Skabelon for et nyt modul (kopiér, ret, gem):
#      - dato: 2026-11-17
#        modul: 2                      # modulnummer på dagen
#        tekst: Vi lavede [[slug]] og regnede opgaver i [[slug|egen linktekst]]
#        lektier: Læs [[slug]]
#        eksp: [slug]                  # eller udvidet: - side: slug / timer: 4 / aflevering: J / eksamen: ja
# Alle andre felter (emne, materialer, maal) er valgfrie.

forloeb:
  - navn: "Repetition"
    side: ""                         # slug til forløbets emneside (valgfri)
    moduler:
      - dato: 2026-08-10
        modul:
        emne: "Ammoniumchlorid som ionforbindelse"
        tekst: "Vi repeterer ioner. Ionstørrelser er vigtig information for den biologiske opførsel af ionerne. Læs derfor grundigt side 143"
        materialer: ["I gang med kemi ionforbidelser og koncentrationer"]
        maal: ["At repetere ioner og starter på begreberne endoterm og eksoterm"]
        lektier: "Ingen lektier"

  - navn: "Repetition fra 1g"
    side: ""                         # slug til forløbets emneside (valgfri)
    moduler:
      - dato: 2026-08-13
        modul:
        emne: "Repetition fra 1g (fortsat)"
        tekst: "Vi brugte langt tid på elektronprikformler. Udelt salt-i-ting eksperiment"
        materialer: ["salt-i-ting"]
        maal: ["Elektronprikformler i bund. Fint for chlorid og ammonium svært for nitrat"]
        lektier: "Side 135 - 143"

      - dato: 2026-08-20
        modul:
        emne: "ioner"
        tekst: "Der er mange målinger så får fart på"
        materialer: ["salt-i-ting"]
        maal: ["Titrering af salt med DCF"]
        lektier: "side 143 - 155"
        eksp:
          - side: "salt-i-ting"
            navn: "Salt i ting"
            timer: 4
            aflevering: "R i Lectio"
            kommentar: "DCF driller lidt"
            eksamen: "ja"

      - dato: 2026-08-24
        modul:
        emne: "ioner"
        tekst: "Vi laver nogle titreringsopgaver fra hjemmesiden og titrerer på chips, brakvand og havvand"
        materialer: ["salt-i-ting"]
